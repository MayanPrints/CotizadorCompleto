<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MAYAN PRINTS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* Restaurando todos tus estilos originales */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0c29;--bg2:#1a1040;--purple:#a084ee;--p2:#7c5cbf;
  --text:#e8e0ff;--muted:rgba(200,180,255,.5);--muted2:rgba(200,180,255,.3);
  --card:rgba(255,255,255,.04);--border:rgba(150,120,255,.15);
  --ibg:rgba(255,255,255,.05);--iborder:rgba(150,120,255,.25);
  --green:#34d399;--red:#f87171;--yellow:#fbbf24;
  --font:'Outfit',sans-serif;
}
body{background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);font-family:var(--font);min-height:100vh;padding:15px;line-height:1.5;overflow-x:hidden}
.container{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
h1{font-weight:600;letter-spacing:-1px;font-size:24px;color:var(--purple)}

/* Sistema de navegación y tarjetas original */
.nav{display:flex;gap:8px;margin-bottom:25px;background:var(--card);padding:5px;border-radius:15px;border:1px solid var(--border);overflow-x:auto}
.nav-btn{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;transition:0.3s;white-space:nowrap}
.nav-btn.active{background:var(--purple);color:var(--bg)}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;backdrop-filter:blur(10px);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}

/* Estilos de inputs y botones que ya tenías */
input,select,textarea{width:100%;background:var(--ibg);border:1px solid var(--iborder);padding:12px;border-radius:12px;color:#fff;margin-top:8px;font-family:inherit;transition:0.3s}
input:focus{border-color:var(--purple);outline:none;background:rgba(255,255,255,.08)}
.btn{padding:12px 24px;border-radius:12px;border:none;font-weight:600;cursor:pointer;transition:0.3s;font-family:inherit;margin-top:10px}
.btn-pri{background:var(--purple);color:var(--bg)}
.btn-sec{background:var(--muted2);color:#fff}
.btn-pri:disabled{opacity:.4;cursor:not-allowed}

/* Historial y estados */
.tx-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);align-items:center}
.status{padding:4px 8px;border-radius:6px;font-size:11px;text-transform:uppercase;font-weight:600}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>MAYAN PRINTS</h1>
    <button class="btn-sec" onclick="openSettings()" style="padding:8px;border-radius:10px;font-size:18px">⚙️</button>
  </header>

  <nav class="nav">
    <button class="nav-btn active" onclick="showTab('dash')">Panel</button>
    <button class="nav-btn" onclick="showTab('orders')">Pedidos</button>
    <button class="nav-btn" onclick="showTab('clients')">Clientes</button>
    <button class="nav-btn" onclick="showTab('finances')">Finanzas</button>
  </nav>

  <div id="tab-dash" class="tab-content">
    <div class="grid">
      <div class="card">
        <h4 style="color:var(--muted);font-size:12px;text-transform:uppercase">Ventas del Mes</h4>
        <div id="stat-sales" style="font-size:28px;font-weight:600;margin:10px 0">$0</div>
        <canvas id="mainChart" style="max-height:150px"></canvas>
      </div>
      <div class="card">
        <h4 style="color:var(--muted);font-size:12px;text-transform:uppercase">Acciones Rápidas</h4>
        <button class="btn btn-pri full" onclick="showTab('orders')">+ Nuevo Pedido</button>
        <button class="btn btn-sec full" onclick="showTab('clients')">Ver Clientes</button>
      </div>
    </div>
  </div>

  <div id="tab-clients" class="tab-content" style="display:none">
    <div class="card">
      <h3>Nuevo Cliente</h3>
      <input type="text" id="c-name" placeholder="Nombre completo">
      <input type="tel" id="c-phone" placeholder="Teléfono (10 dígitos)" oninput="vPh()">
      <button class="btn btn-pri" id="c-save" onclick="saveClient()" disabled>Registrar Cliente</button>
    </div>
    <div class="card">
      <h3>Lista de Clientes</h3>
      <div id="client-list"></div>
    </div>
  </div>

  </div>

<script>
// --- LÓGICA DE CONEXIÓN Y SINCRONIZACIÓN ---
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzrCVubxxnv2K-90M7xknJ3vqD8gx5tiRge_v_vdhwJld1zXGcpAgU2WBF1ykkBhfswyw/exec"; // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT

async function sync(sheet, action, row, id = null) {
  if(!WEB_APP_URL || WEB_APP_URL === "https://script.google.com/macros/s/AKfycbzrCVubxxnv2K-90M7xknJ3vqD8gx5tiRge_v_vdhwJld1zXGcpAgU2WBF1ykkBhfswyw/exec") return;
  try {
    await fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ sheet, action, row, id })
    });
  } catch (e) { console.error("Sync error:", e); }
}

// --- FUNCIONES RESTAURADAS DE TU ARCHIVO ORIGINAL ---
const $ = id => document.getElementById(id);
let clients = JSON.parse(localStorage.getItem('mp_clients') || '[]');

function vPh() {
  const p = $('c-phone').value;
  $('c-save').disabled = p.length !== 10;
  $('c-save').style.opacity = p.length === 10 ? '1' : '.4';
}

function showTab(id) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  $(`tab-${id}`).style.display = 'block';
  event.target.classList.add('active');
}

function saveClient() {
  const name = $('c-name').value;
  const phone = $('c-phone').value;
  const newClient = { id: Date.now(), name, phone, date: new Date().toLocaleDateString() };
  
  clients.push(newClient);
  localStorage.setItem('mp_clients', JSON.stringify(clients));
  
  // Sincronizar con Sheets (Capa invisible)
  sync('Clientes', 'append', [newClient.id, name, phone, '', '', newClient.date]);
  
  $('c-name').value = ''; $('c-phone').value = '';
  renderClients();
  alert("Cliente registrado en MAYAN PRINTS");
}

function renderClients() {
  const list = $('client-list');
  list.innerHTML = clients.map(c => `
    <div class="tx-row">
      <div><strong>${c.name}</strong><br><small>${c.phone}</small></div>
      <button class="btn-sec" style="padding:5px 10px;font-size:12px">Detalles</button>
    </div>
  `).join('');
}

// Inicialización de Gráfica Original
function initChart() {
  const ctx = $('mainChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Sem 1', 'Sem 2', 'Sem 3', 'Sem 4'],
      datasets: [{
        label: 'Ventas',
        data: [12000, 19000, 15000, 25000],
        borderColor: '#a084ee',
        tension: 0.4,
        fill: true,
        backgroundColor: 'rgba(160,132,238,0.1)'
      }]
    },
    options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
  });
}

// Ejecutar al cargar
window.onload = () => {
  renderClients();
  initChart();
};
</script>
</body>
</html>
