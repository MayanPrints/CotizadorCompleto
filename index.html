<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MAYAN PRINTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#0f0c29;--bg2:#1a1040;--purple:#a084ee;--p2:#7c5cbf;
            --text:#e8e0ff;--muted:rgba(200,180,255,.5);--muted2:rgba(200,180,255,.3);
            --card:rgba(255,255,255,.04);--border:rgba(150,120,255,.15);
            --ibg:rgba(255,255,255,.05);--iborder:rgba(150,120,255,.25);
            --green:#34d399;--red:#f87171;--yellow:#fbbf24;
            --font:'Outfit',sans-serif;
        }
        body{background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);font-family:var(--font);min-height:100vh;padding:20px}
        .container{max-width:1100px;margin:0 auto}
        header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
        h1{font-weight:600;letter-spacing:-1px;font-size:24px;color:var(--purple)}
        .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;backdrop-filter:blur(10px);margin-bottom:20px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
        
        /* Estilos de botones y formularios */
        input, select, textarea{
            width:100%;background:var(--ibg);border:1px solid var(--iborder);
            padding:12px;border-radius:12px;color:#fff;margin-top:8px;font-family:inherit;
        }
        .btn{
            padding:12px 24px;border-radius:12px;border:none;font-weight:600;
            cursor:pointer;transition:all 0.3s;font-family:inherit;margin-top:10px;
        }
        .btn-pri{background:var(--purple);color:var(--bg)}
        .btn-pri:hover{background:var(--p2);transform:translateY(-2px)}
        .btn-pri:disabled{opacity:0.4;cursor:not-allowed}
        
        .tx-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)}
        .status{padding:4px 8px;border-radius:6px;font-size:11px;text-transform:uppercase}
        .s-pend{background:rgba(251,191,36,0.1);color:var(--yellow)}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MAYAN PRINTS</h1>
            <div id="date-display" style="font-size:13px;color:var(--muted)"></div>
        </header>

        <div class="grid">
            <div class="card">
                <h3>Nuevo Cliente</h3>
                <input type="text" id="c-name" placeholder="Nombre completo">
                <input type="tel" id="c-phone" placeholder="Teléfono (10 dígitos)" oninput="validatePhone()">
                <input type="email" id="c-email" placeholder="Correo (Opcional)">
                <button class="btn btn-pri" id="c-save" onclick="saveClient()" disabled>Registrar Cliente</button>
            </div>

            <div class="card">
                <h3>Nuevo Pedido</h3>
                <select id="p-client"><option value="">Seleccionar Cliente...</option></select>
                <input type="number" id="p-dtf" placeholder="Metros DTF" oninput="calcTotal()">
                <input type="number" id="p-garment" placeholder="Cantidad de Prendas" oninput="calcTotal()">
                <div style="margin-top:15px;font-size:18px;font-weight:600">Total: <span id="p-total">$0</span></div>
                <button class="btn btn-pri" onclick="createOrder()">Crear Pedido</button>
            </div>
        </div>

        <div class="card">
            <h3>Historial Reciente</h3>
            <div id="tx-list"></div>
        </div>
    </div>

    <script>
        // 1. CONFIGURACIÓN - PEGA TU URL AQUÍ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzrCVubxxnv2K-90M7xknJ3vqD8gx5tiRge_v_vdhwJld1zXGcpAgU2WBF1ykkBhfswyw/exec"; 

        // Variables de estado
        let clients = JSON.parse(localStorage.getItem('mp_clients') || '[]');
        let orders = JSON.parse(localStorage.getItem('mp_orders') || '[]');

        // Sincronización con Google Sheets
        async function sync(sheet, action, row, id = null) {
            if (WEB_APP_URL === "PEGA_AQUÍ_TU_URL_DE_APPS_SCRIPT") {
                console.warn("Falta configurar la URL de Apps Script.");
                return;
            }
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ sheet, action, row, id })
                });
            } catch (e) { console.error("Error sincronizando:", e); }
        }

        // Validación de Teléfono
        function validatePhone() {
            const p = document.getElementById('c-phone').value;
            document.getElementById('c-save').disabled = p.length !== 10;
        }

        // Guardar Cliente
        function saveClient() {
            const name = document.getElementById('c-name').value;
            const phone = document.getElementById('c-phone').value;
            const email = document.getElementById('c-email').value;
            
            const newClient = { id: Date.now(), name, phone, email, date: new Date().toLocaleDateString() };
            clients.push(newClient);
            localStorage.setItem('mp_clients', JSON.stringify(clients));
            
            // Sincronizar (Fila para Google Sheets)
            sync('Clientes', 'append', [newClient.id, name, phone, email, '', newClient.date]);
            
            updateClientSelect();
            alert("Cliente registrado");
            document.getElementById('c-name').value = '';
            document.getElementById('c-phone').value = '';
        }

        // Calcular Total (Redondeo hacia arriba según preferencia)
        function calcTotal() {
            const m = parseFloat(document.getElementById('p-dtf').value || 0);
            const g = parseInt(document.getElementById('p-garment').value || 0);
            // Ejemplo de lógica: $150 por metro + $50 por prenda
            let total = (m * 150) + (g * 50);
            total = Math.ceil(total); // Redondear al entero superior
            document.getElementById('p-total').innerText = '$' + total;
            return total;
        }

        // Crear Pedido
        function createOrder() {
            const clientId = document.getElementById('p-client').value;
            const total = calcTotal();
            if(!clientId) return alert("Selecciona un cliente");

            const order = {
                id: 'ORD-' + Date.now().toString().slice(-4),
                date: new Date().toLocaleString(),
                client: clients.find(c => c.id == clientId).name,
                total: total
            };

            sync('Pedidos', 'append', [order.id, order.date, order.client, '', '', '', '', order.total, '', 'Pendiente']);
            
            alert("Pedido enviado a la hoja de cálculo");
        }

        function updateClientSelect() {
            const s = document.getElementById('p-client');
            s.innerHTML = '<option value="">Seleccionar Cliente...</option>' + 
                clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        // Inicialización
        document.getElementById('date-display').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        updateClientSelect();
    </script>
</body>
</html>
